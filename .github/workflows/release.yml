name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack the tarballs without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./packages/core/package.json').version")
          test "$tag" = "$version" || { echo "tag $tag != version $version"; exit 1; }
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: pnpm -r --filter './packages/*' pack --pack-destination /tmp/ludin-tarballs
      # `pnpm publish` (not `npm publish`) is required: it rewrites the
      # `workspace:*` dependency ranges to real versions. It has no
      # --provenance flag, so releases are plain npm publishes.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --access public --no-git-checks
